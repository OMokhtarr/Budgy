<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#10b981" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/png" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Budgy</title>
    <script>
      // Apply the saved theme before the first paint (same rule as applyTheme in SettingsContext), so
      // neither the splash nor the app shows the other theme first.
      try {
        var theme = JSON.parse(localStorage.getItem('budgy-settings') || '{}').theme || 'system';
        if (theme === 'dark' || (theme === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('ion-palette-dark');
        }
      } catch (e) {}
    </script>
    <style>
      #budgy-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 24px;
        /* The app's background (--b-bg in src/index.css), so the splash fades straight into the app */
        background: #f4f6f8;
        transition: opacity 0.25s ease;
      }
      .ion-palette-dark #budgy-splash { background: #131315; }
      #budgy-splash.budgy-splash--hidden {
        opacity: 0;
        pointer-events: none;
      }
      #budgy-splash img {
        width: 112px;
        height: 112px;
        border-radius: 28px;
        animation: budgy-splash-pulse 1.6s ease-in-out infinite;
      }
      @keyframes budgy-splash-pulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.06); opacity: 0.85; }
      }
    </style>
  </head>
  <body>
    <div id="budgy-splash">
      <img src="/icon.png" alt="Budgy" />
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
